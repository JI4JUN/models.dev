# 302.AI alias endpoint for latest GPT chat (GPT-5.5 tier at $5/$30 per M tokens).
# Served by 302.AI with a 400,000 token context window cap per official API catalog.
base_model = "openai/gpt-5.5"
name = "chat-latest"
reasoning_options = [{ type = "effort", values = ["none", "low", "medium", "high", "xhigh"] }]

[cost]
input = 5.0
output = 30.0

[limit]
context = 400_000
