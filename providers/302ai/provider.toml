name = "302.AI"
env = ["302AI_API_KEY"]
npm = "@ai-sdk/openai-compatible"
# Relay provider: 302.AI proxies multi-model lab endpoints (OpenAI, Anthropic, GLM, Qwen, DeepSeek, etc.).
# Reasoning controls map to upstream lab surfaces:
# - OpenAI / GPT: `reasoning_effort`
# - Anthropic / Claude: `output_config.effort` and optional `thinking.type`
# - GLM / Zhipu: `thinking.type = enabled|disabled`
# - Qwen / Alibaba: `enable_thinking true|false` and `thinking_budget`
# - Dedicated thinking IDs (e.g. *-thinking, Gemini, MiniMax): []
doc = "https://doc.302.ai"
api = "https://api.302.ai/v1"
